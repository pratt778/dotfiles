# Global Gradle Configuration (Optimized for 8GB RAM / Dual-Core CPU)
# Location: ~/.gradle/gradle.properties
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Performance & Resource Tuning
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon.idletimeout=180000
org.gradle.workers.max=2
